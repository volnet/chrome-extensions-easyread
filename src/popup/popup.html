<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="../styles/easyread.css" />
	<link rel="stylesheet" href="popup.css" />
	<script src="../scripts/copyright.js" type="text/javascript"></script>
	<script src="../scripts/hls.min.js" type="text/javascript"></script>
	<script src="popup.js" type="module"></script>
</head>

<body>
	<template id="templateReadLater">
		<li>
			<input type="checkbox" id="checkbox1">
			<label for="checkbox1"><a href="" target="_blank" title="Page Title">Page Title</a><span
					class="progress"></span></label>
		</li>
	</template>
	<template id="templateAllRecords">
		<span class="titleAllRecords">Page's Title</span>
		<p class="url">Page's URL</p>
		<p class="message">Message</p>
		<p class="readedTimes">ReadedTimes</p>
	</template>
	<template id="templateNotes">
		<li>
			<span class="noteItem"></span>
		</li>
	</template>
	<div>
		<div class="buttonLineWrapper">
			<div id="popupTitle" class="buttonLineDivLeft extensionTitle">EasyRead: enjoy your reading</div>
			<div class="buttonLineDivRight extensionButtons">
				<button type="button" id="btnAnnotations" class="topIconButton" aria-pressed="false">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H9l-4 4V4Z"></path><path d="M9 8h6M9 12h4"></path></svg>
				</button>
				<img src="../assets/allRecords.png" id="btnAllRecords" class="buttonImg" alt="View all records">
				<img src="../assets/setting.png" id="btnSetting" class="buttonImg" alt="Setting">
			</div>
		</div>
		<div id="outputMesssages" class="outputMesssages"></div>
		<div class="popupTabs" role="tablist">
			<button id="tabReadLater" class="popupTab isActive" role="tab" aria-selected="true" aria-controls="panelReadLater"></button>
			<button id="tabSavePage" class="popupTab" role="tab" aria-selected="false" aria-controls="panelSavePage"></button>
			<button id="tabMedia" class="popupTab" role="tab" aria-selected="false" aria-controls="panelMedia"><span class="tabLabel"></span><span id="mediaBadge" class="tabBadge" hidden></span></button>
		</div>
		<section id="panelReadLater" class="popupPanel" role="tabpanel" aria-labelledby="tabReadLater">
		<div id="outputReadLaters" class="outputReadLaters">
			<div class="buttonWrapper">
				<button id="btnReadLater" class="buttonWithIcon">
					<img src="../assets/readlater-icon.png" /><span id="btnReadLaterText">Read Later</span>
				</button>
			</div>
			<span id="titleReadLaters" class="titleReadLaters"></span>
			<ol></ol>
		</div>
		<div id="outputNotesSeperator" class="outputNotesSeperatorDefault">
			<hr />
		</div>
		<div id="outputNotes" class="outputNotesDefault">
			<div class="buttonWrapper">
				<img src="../assets/download-file.png" id="btnDownloadNotes" class="buttonImg" alt="Download the page's highlights">
				<img src="../assets/delete.png" id="btnRemoveNotes" class="buttonImg" alt="Delete the page's highlights">
			</div>
			<span id="titleNotes" class="titleNotes"></span>
			<ol></ol>
		</div>
		<div>
			<hr />
		</div>
		<div id="outputAllRecords" class="outputAllRecords">
			<div class="buttonWrapper">
				<img src="../assets/delete.png" id="btnReadedAndRemove" class="buttonImg"
					alt="Delete the page's records">
			</div>
		</div>
		</section>
		<section id="panelSavePage" class="popupPanel" role="tabpanel" aria-labelledby="tabSavePage" hidden>
			<div class="saveIntro" id="savePageIntro"></div>
			<div class="saveOptions">
				<div class="saveOption"><span class="saveIcon">HTML</span><span><strong id="saveHtmlTitle"></strong><small id="saveHtmlDescription"></small></span><div class="saveActions"><button class="primarySave" data-capture="html"></button></div></div>
				<div class="saveOption"><span class="saveIcon">PDF</span><span><strong id="savePdfTitle"></strong><small id="savePdfDescription"></small></span><div class="saveActions"><button class="primarySave" data-capture="pdf"></button></div></div>
				<div class="saveOptionGroup">
					<div class="saveOptionHeading"><span class="saveIcon">IMG</span><span><strong id="saveImageTitle"></strong><small id="saveImageDescription"></small></span></div>
					<div class="segmentedControl" id="imageScope"><button data-value="viewport" class="isActive"></button><button data-value="fullPage"></button></div>
					<div class="segmentedControl" id="imageFormat"><button data-value="png" class="isActive">PNG</button><button data-value="jpeg">JPG</button></div>
					<div class="saveActions"><button class="secondarySave" data-copy="image" id="copyImageAction"></button><button class="primarySave" data-capture="image" id="saveImageAction"></button></div>
				</div>
				<div class="saveOption"><span class="saveIcon">MD</span><span><strong id="saveMarkdownTitle"></strong><small id="saveMarkdownDescription"></small></span><div class="saveActions"><button class="secondarySave" data-copy="markdown" id="copyMarkdownAction"></button><button class="primarySave" data-capture="markdown"></button></div></div>
			</div>
			<div id="captureTask" class="taskFeedback" hidden><div class="taskMeta"><strong id="captureTaskTitle"></strong><span id="captureTaskPercent"></span></div><progress id="captureProgress" max="100" value="0"></progress><p id="captureTaskStage"></p></div>
		</section>
		<section id="panelMedia" class="popupPanel" role="tabpanel" aria-labelledby="tabMedia" hidden>
			<div id="mediaEmptyState" class="mediaEmptyState" role="status" aria-live="polite" hidden>
				<div class="mediaEmptyArtwork" aria-hidden="true">
					<span class="mediaFormatChip mediaFormatChipVideo">MP4</span>
					<div class="mediaArtworkWindow">
						<div class="mediaArtworkBar"><i></i><i></i><i></i></div>
						<div class="mediaArtworkScreen">
							<svg viewBox="0 0 24 24" focusable="false"><path d="M9 7.7v8.6c0 .8.9 1.3 1.6.9l6.5-4.3c.6-.4.6-1.3 0-1.7l-6.5-4.3c-.7-.5-1.6 0-1.6.8Z"/></svg>
						</div>
						<div class="mediaArtworkTrack"><span></span></div>
					</div>
					<span class="mediaFormatChip mediaFormatChipAudio">Audio</span>
				</div>
				<strong id="mediaEmptyTitle"></strong>
				<p id="mediaEmptyDescription"></p>
			</div>
			<div id="mediaList" class="popupMediaList"></div>
		</section>
		<div class="copyright">
		</div>
	</div>
</body>

</html>
