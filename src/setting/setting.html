<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="../styles/easyread.css" />
	<script src="../scripts/copyright.js" type="text/javascript"></script>
	<link rel="stylesheet" href="setting.css" />
	<script type="text/javascript" src="../scripts/jszip.min.js"></script>
	<script src="setting.js" type="module"></script>
</head>

<body>
	<main class="settingsShell">
	<header class="settingsHeader"><h1 id="setting_page_title">EasyRead</h1><p id="setting_page_notice"></p></header>
	<nav class="settingsTabs" role="tablist">
		<button class="settingsTab isActive" data-panel="generalPanel" id="setting_tab_general" role="tab"></button>
		<button class="settingsTab" data-panel="dataPanel" id="setting_tab_data" role="tab"></button>
		<button class="settingsTab" data-panel="backupPanel" id="setting_tab_backup" role="tab"></button>
	</nav>
	<section id="generalPanel" class="settingsPanel isActive" role="tabpanel">
	<div class="settingBlock settingToggleBlock">
		<div><strong id="settingHighlightsTitle">Show page highlights</strong><p id="settingHighlightsDescription"></p></div>
		<label class="modernSwitch" for="settingHighlightsEnabled">
			<input type="checkbox" id="settingHighlightsEnabled" />
			<span aria-hidden="true"></span>
		</label>
	</div>
	<div class="sectionHeading"><h2 id="setting_page_notice_annotationAuthor">Annotation author</h2></div>
	<div class="settingBlock annotationAuthorBlock">
		<label id="annotationAuthorLabel" for="annotationAuthor">Author shown beside new annotations</label>
		<div class="inlineSetting">
			<input type="text" id="annotationAuthor" maxlength="80" autocomplete="name" />
			<button id="btnSaveAnnotationAuthor" type="button">Save</button>
		</div>
	</div>
	</section>
	<section id="dataPanel" class="settingsPanel" role="tabpanel" hidden>
	<h2 id="setting_page_notice_allRecords">Reading history</h2>
	<div class="settingBlock">
		<button id="btnDownloadAllRecordsAsJson">Download All Records</button><br /><br />
		<button id="btnRemoveAllRecords" class="btnWarning">Remove All Records</button>
	</div>
	<h2 id="setting_page_notice_readLaters">Read later</h2>
	<div class="settingBlock">
		<button id="btnDownloadReadLatersAsJson">Download ReadLaters</button><br /><br />
		<button id="btnRemoveReadLaters" class="btnWarning">Remove Read Laters</button>
	</div>
	<h2 id="setting_page_notice_notes">Highlights</h2>
	<div class="settingBlock">
		<button id="btnDownloadNotesAsJson">Download Highlights as JSON (*.json)</button><br /><br />
		Markdown Template:
		<textarea id="txtMarkdownTemplate" class="txtMarkdownTemplate">
# $title$

- Tags: #EasyRead
- CreateDateTime: $createDateTime$
- Link: [$title$]($url$)

---

## Highlights
{notes_section}</textarea><br />{notes_section}:
		<textarea id="txtMarkdownNotesSectionTemplate" class="txtMarkdownNotesSectionTemplate">

### $createDateTime$

$selectionText$
</textarea><br />
		<button id="btnDownloadNotesAsMarkdown">Download Highlights as Markdown (*.zip)</button><br /><br />
		<button id="btnRemoveNotes" class="btnWarning">Remove Highlights</button>
	</div>
	</section>
	<section id="backupPanel" class="settingsPanel" role="tabpanel" hidden>
	<h2 id="setting_page_notice_storage">Full backup</h2>
	<div class="settingBlock">
		<button id="btnDownloadStorageAsJson">Download Storage</button><br /><br />
		<input type="file" id="fileInputStorageJson" accept="application/json" />
		<button id="btnMergeStorageJson" class="btnWarning">Merge Storage</button>
		<button id="btnReplaceStorageJson" class="btnWarning">Replace Storage</button><br /><br />
		<button id="btnDropStorage" class="btnWarning">Drop Storage</button>
	</div>
	</section>
	<div id="output" class="output" role="status" aria-live="polite"></div>
	<div class="copyright">
	</div>
	</main>
</body>

</html>
